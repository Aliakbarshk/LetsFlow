
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Flow | WhatsApp Automation & AI Call Agents</title>
    <meta name="description" content="Scale your brand 24/7 with Let's Flow. High-performance WhatsApp bots, official Meta API integrations, and AI call agents managing 10k+ bulk queries with zero manual labor.">
    <meta name="keywords" content="WhatsApp automation, WhatsApp bots, Meta WhatsApp API, AI call agents, bulk query automation, workflow automation, Let's Flow">
    <meta name="author" content="Let's Flow">
    <meta name="theme-color" content="#0b141a">
    <meta name="robots" content="index, follow">

    <!-- OpenGraph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Let's Flow">
    <meta property="og:title" content="Let's Flow | WhatsApp Automation & AI Call Agents">
    <meta property="og:description" content="High-performance WhatsApp automation bots and AI call agents. Handle 10,000+ simultaneous queries with official Meta WhatsApp API.">
    <meta property="og:image" content="/assets/thelogo.png">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Let's Flow | WhatsApp Automation & AI Call Agents">
    <meta name="twitter:description" content="High-performance WhatsApp automation bots and AI call agents. Handle 10,000+ simultaneous queries with official Meta WhatsApp API.">
    <meta name="twitter:image" content="/assets/thelogo.png">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Let's Flow",
      "logo": "/assets/thelogo.png",
      "description": "Enterprise WhatsApp automation and AI call agents handling thousands of simultaneous customer queries with zero manual labor.",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-84829-34502",
        "contactType": "customer service",
        "email": "letsflowmanagement@gmail.com",
        "availableLanguage": ["English", "Hindi"]
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Let's Flow",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "description": "High-performance WhatsApp bots and workflow automation managing bulk customer inquiries seamlessly."
    }
    </script>

    <link rel="icon" type="image/png" href="/assets/thelogo.png">
    <link rel="apple-touch-icon" href="/assets/thelogo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --wa-green: #25d366;
            --wa-bg: #0b141a;
            --wa-panel: #111b21;
            --wa-header: #202c33;
            --wa-bubble-me: #005c4b;
            --wa-bubble-them: #202c33;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000;
            color: #ffffff;
            scroll-behavior: smooth;
            cursor: none;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        h1, h2, h3 { font-family: 'Outfit', sans-serif; }

        .cursor-dot {
            position: fixed;
            top: 0; left: 0;
            width: 8px; height: 8px;
            background-color: var(--wa-green);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }
        .cursor-bubble {
            position: fixed;
            top: 0; left: 0;
            width: 40px; height: 40px;
            background-color: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
            transition: width 0.3s, height 0.3s;
        }
        .cursor-active .cursor-bubble { width: 80px; height: 80px; }

        .wa-bg-pattern {
            background-image: url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png");
            background-repeat: repeat;
            opacity: 0.05;
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 5s ease-in-out infinite; }
        
        .splash-exit { 
            transform: translateY(-100%);
            transition: transform 0.8s cubic-bezier(0.7, 0, 0.3, 1);
        }
    </style>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
